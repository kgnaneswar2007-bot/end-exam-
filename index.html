
<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>
    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            padding: 30px;
            width: 300px;
            border-radius: 10px;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: darkblue;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Login Form</h2>

        <input type="text" id="username"
               placeholder="Enter Username">

        <input type="password" id="password"
               placeholder="Enter Password">

        <button onclick="login()">Login</button>

        <p id="message"></p>
    </div>

    <script>
        function login() {
            let user = document.getElementById("username").value;
            let pass = document.getElementById("password").value;

            if (user === "admin" && pass === "12345") {
                document.getElementById("message").innerHTML =
                    "Login Successful!";
            } 
            else {
                document.getElementById("message").innerHTML =
                    "Invalid Username or Password!";
            }
        }
    </script>

</body>
</html>
